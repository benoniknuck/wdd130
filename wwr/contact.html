<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta name="description"
      content="Contact White Water Rafting for questions, reservations, and information about our rafting adventures.">
    <meta name="author" content="Benoni Knuckles">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafting site logo">
        <nav class="pages_buttons">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
 
        </nav>
    </header>

    <main>
        <div class="contact_hero">
            


            <h1> White Water Rafting</h1>
            <h2> 1st street sinkor monrovia</h2>
            <h3> +231 881 164 582</h3>
            <h3>whitewaterrafting@email.com</h3>
        </div>

            <div class="contact_form">

                <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d247.88703417981733!2d-10.684063705256479!3d6.238334065805927!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xf0a0114f4e6e07b%3A0xd849879d15c62388!2sHotel%20Veldina!5e0!3m2!1sen!2s!4v1791170333077!5m2!1sen!2s"></iframe>
                </div>
                <form class="form">

                    <div class="form-row">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-row">
                        <span class="form-label">
                            Message<br>Purpose
                        </span>

                        <div class="radio-buttons">
                            
                            <div>
                                <label>
                                    <input type="radio" id="general-inquiry" name="purpose" value="general-inquiry" required>General Inquiry
                                </label>
                            </div>

                            <div>
                                <label>
                                    <input type="radio" id="reservation-question" name="purpose" value="reservation-question">
                                    Reservation Question
                                </label>
                            </div>

                            <div>
                                <label>
                                    <input type="radio" id="website-suggestion" name="purpose" value="website-suggestion">
                                    Website Suggestion
                                </label>
                            </div>

                        </div>
                    </div>

                   <div class="form-row message-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type here" rows="5"></textarea>
                    </div>

                    <label class="newsletter">
                        <input type="checkbox" id="subscribe" name="subscribe">Please Subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>      
                        
            </div>

        

       
            <h2>We Are Here to Serve You!</h2>

            <figure class="employee-profiles">
                <figure>
                    <img src="images/ceo.jpg" alt="picture of the CEO">
                    <figcaption>C.E.O</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="General Manager">
                    <figcaption>General Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Director of Procurement">
                    <figcaption>Director of Procurement</figcaption>
                </figure>

           
            </figure>


        
    </main>

    <footer>
        <p>
            ©️2026 🗞️White Water Rafting 🗞️Benoni Ben Knuckles 🗞️
        </p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook.svg"
                  alt="facebook Icon"></a>
            <a href="https://instagram.com"> <img src="images/instagram.svg"
                  alt="instagram Icon"></a>
            <a href="https://linkin.com"> <img src="images/linkedin.svg" alt="linkin Icon"></a>

        </nav>
    </footer>


</body>

</html>
